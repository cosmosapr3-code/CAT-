name: Build stage title contact sheets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/inspect_stage_cards.py'
      - '.github/workflows/inspect-stage-cards.yml'

permissions:
  contents: read

jobs:
  contact-sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image decoders
        run: python -m pip install pillow cairosvg
      - name: Extract original stage title cards
        run: python tools/inspect_stage_cards.py
      - name: Upload stage title contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: stage-title-contact-sheets
          path: stage-contact-sheets/
