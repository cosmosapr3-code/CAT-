name: Build legacy character roster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-legacy-roster.yml'
      - 'tools/restore_legacy_characters.py'
      - 'CAT大戦争_完全版_1ファイル軽量版.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tools
        run: python -m pip install --upgrade pillow cairosvg

      - name: Recover original characters and images
        run: python tools/restore_legacy_characters.py

      - name: Commit restored roster for Cloudflare deployment
        run: |
          git add legacy-roster.json
          if git diff --cached --quiet; then
            echo "Roster unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore original ally and enemy character roster"
          git push
