<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090909">
<title>CAT大戦争</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#cat-game{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#cat-auth-gate{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at 50% 15%,#393939 0,#101010 60%,#050505 100%)}
#cat-auth-gate[hidden]{display:none!important}
#cat-auth-card{width:min(420px,100%);border:2px solid #c99b42;border-radius:18px;background:linear-gradient(160deg,#333,#171717);padding:24px;box-shadow:0 18px 60px #000b;text-align:center}
#cat-auth-card h1{margin:0 0 8px;font-size:27px;font-weight:900;color:#ffe09a}
.cat-auth-sub{margin:0 0 20px;color:#c9c0b0;font-size:13px}
#cat-auth-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
#cat-auth-gate button,#cat-auth-gate input{font:inherit}
#cat-auth-modes button{border:1px solid #82704e;border-radius:10px;padding:10px;background:#242424;color:#ddd;font-weight:800;cursor:pointer}
#cat-auth-modes button.active{background:#815c20;border-color:#f2c96e;color:#fff}
#cat-auth-form{display:grid;gap:10px;text-align:left}
#cat-auth-form label{font-size:12px;font-weight:800;color:#e8d8b8}
#cat-auth-form input{width:100%;margin-top:5px;padding:12px;border:1px solid #776b57;border-radius:9px;background:#090909;color:#fff;outline:none}
#cat-auth-form input:focus{border-color:#f1c86d;box-shadow:0 0 0 2px #f1c86d33}
#cat-auth-submit{margin-top:5px;border:0;border-radius:10px;padding:13px;background:linear-gradient(#f5d58c,#bd842c);color:#271a08;font-weight:900;cursor:pointer}
#cat-auth-submit:disabled{opacity:.55;cursor:wait}
#cat-auth-toggle{display:block;margin:13px auto 0;border:0;background:transparent;color:#f2d48f;text-decoration:underline;cursor:pointer;font-size:13px}
#cat-auth-error{min-height:20px;margin:12px 0 0;color:#ff9d8e;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
#cat-auth-foot{margin:10px 0 0;color:#958d7e;font-size:11px}
#cat-game-loading{display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:#ffe09a;background:#050505;font-weight:800}
</style>
</head>
<body>
<div id="cat-auth-gate" role="dialog" aria-modal="true" aria-labelledby="cat-auth-title">
<div id="cat-auth-card">
<h1 id="cat-auth-title">CAT大戦争</h1>
<p class="cat-auth-sub">ログインしてゲームを始めよう</p>
<div id="cat-auth-modes">
<button type="button" id="cat-player-mode" class="active">プレイヤー</button>
<button type="button" id="cat-admin-mode">運営</button>
</div>
<form id="cat-auth-form">
<label>ユーザー名<input id="cat-auth-username" name="username" autocomplete="username" maxlength="24" required></label>
<label>パスワード<input id="cat-auth-password" name="password" type="password" autocomplete="current-password" minlength="8" required></label>
<button id="cat-auth-submit" type="submit">ログイン</button>
</form>
<button id="cat-auth-toggle" type="button">初めての方はこちら（新規登録）</button>
<p id="cat-auth-error" aria-live="polite"></p>
<p id="cat-auth-foot">ゲーム本体は元のCAT大戦争を使用します。</p>
</div>
</div>
<div id="cat-game-loading">CAT大戦争を読み込み中…</div>
<iframe id="cat-game" title="CAT大戦争" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"></iframe>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const gate=$('cat-auth-gate'),frame=$('cat-game'),loading=$('cat-game-loading');
  const form=$('cat-auth-form'),username=$('cat-auth-username'),password=$('cat-auth-password');
  const submit=$('cat-auth-submit'),toggle=$('cat-auth-toggle'),error=$('cat-auth-error');
  const playerMode=$('cat-player-mode'),adminMode=$('cat-admin-mode');
  let mode='player',registering=false,started=false,auth=null,bootTimer=null,bootPoll=null;

  function labels(){
    submit.textContent=registering?'アカウントを作成':(mode==='admin'?'運営ログイン':'ログイン');
    toggle.textContent=registering?'ログイン画面に戻る':'初めての方はこちら（新規登録）';
    password.autocomplete=registering?'new-password':'current-password';
    toggle.hidden=mode==='admin';
  }
  function setMode(next){
    mode=next;registering=false;
    playerMode.classList.toggle('active',mode==='player');
    adminMode.classList.toggle('active',mode==='admin');
    labels();error.textContent='';
  }
  async function api(url,options={}){
    const res=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||'通信に失敗しました。');
    return data;
  }
  function bootError(message){
    clearInterval(bootPoll);clearTimeout(bootTimer);
    loading.style.display='none';frame.style.display='none';
    gate.hidden=false;error.textContent=message;
  }
  function passAuthToGame(){
    try{
      const w=frame.contentWindow;
      w.CAT_AUTH=auth;
      if(w.scaffolding&&auth.username)w.scaffolding.setUsername(auth.username);
      w.dispatchEvent(new w.CustomEvent('CAT_AUTH_READY',{detail:auth}));
    }catch(e){console.warn('CAT AUTH bridge:',e);}
  }
  function finishGameBoot(w,d){
    if(w.__CAT_EXTERNAL_STARTED)return true;
    try{
      const launch=d.getElementById('launch');
      if(launch)launch.hidden=true;
      const load=d.getElementById('loading');
      if(load)load.hidden=true;
      passAuthToGame();
      w.scaffolding.start();
      w.__CAT_EXTERNAL_STARTED=true;
      frame.style.display='block';
      loading.style.display='none';
      gate.hidden=true;
      clearInterval(bootPoll);clearTimeout(bootTimer);
      return true;
    }catch(e){
      bootError('ゲームの起動に失敗しました: '+(e&&e.message||e));
      return false;
    }
  }
  function monitorGameBoot(){
    clearInterval(bootPoll);clearTimeout(bootTimer);
    bootPoll=setInterval(()=>{
      try{
        const w=frame.contentWindow,d=w.document;
        if(!d||!d.head)return;
        if(!d.getElementById('cat-hide-scratch-controls')){
          const st=d.createElement('style');
          st.id='cat-hide-scratch-controls';
          st.textContent='#loading,#launch,.control-button,.green-flag-button,.pause-button,.stop-all-button,.fullscreen-button{display:none!important;visibility:hidden!important;pointer-events:none!important}';
          d.head.appendChild(st);
        }
        const load=d.getElementById('loading');
        const scratchError=d.getElementById('error');
        if(scratchError&&!scratchError.hidden){
          const msg=d.getElementById('error-message')?.textContent||'元ゲームの読み込みに失敗しました。';
          bootError(msg);return;
        }
        const projectLoad=d.getElementById('loading');
        if(w.scaffolding&&projectLoad&&projectLoad.hidden)finishGameBoot(w,d);
      }catch(e){
        bootError('ゲーム画面に接続できませんでした: '+(e&&e.message||e));
      }
    },150);
    bootTimer=setTimeout(()=>bootError('ゲームの読み込みが完了しませんでした。ページを再読み込みしてください。'),180000);
  }
  frame.addEventListener('load',()=>{
    if(!auth)return;
    monitorGameBoot();
  });
  function enterGame(session){
    auth={role:session.role==='admin'?'admin':'player',username:String(session.username||'')};
    window.CAT_AUTH=auth;
    gate.hidden=true;
    loading.textContent='CAT大戦争を起動中…';
    loading.style.display='flex';
    if(!started){
      started=true;
      frame.src=new URL('CAT大戦争_完全版_1ファイル軽量版.html',window.location.href).href;
    }else{
      monitorGameBoot();
    }
    window.dispatchEvent(new CustomEvent('CAT_AUTH_READY',{detail:auth}));
  }
  playerMode.addEventListener('click',()=>setMode('player'));
  adminMode.addEventListener('click',()=>setMode('admin'));
  toggle.addEventListener('click',()=>{registering=!registering;labels();error.textContent='';});
  form.addEventListener('submit',async e=>{
    e.preventDefault();error.textContent='';submit.disabled=true;
    try{
      const payload={username:username.value.trim(),password:password.value};
      const result=registering
        ?await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
        :await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,mode})});
      enterGame({role:result.role||mode,username:result.username||payload.username});
    }catch(err){error.textContent=err.message||'ログインに失敗しました。';}
    finally{submit.disabled=false;}
  });
  api('/api/me').then(enterGame).catch(()=>{gate.hidden=false;});
  labels();
})();
</script>
</body>
</html>
